services:
  # Web Service
  - type: web
    name: voteapp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn voteapp.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voteapp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: voteapp.onrender.com

  # PostgreSQL Database
  - type: pserv
    name: voteapp-db
    env: postgres
    plan: free
    user: voteapp_user
    databaseName: voteapp_db
    ipAllowList: []
