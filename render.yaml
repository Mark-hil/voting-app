services:
  # Web Service
  - type: web
    name: voteapp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py shell -c "import os; os.makedirs('media', exist_ok=True); os.makedirs('media/candidates', exist_ok=True)"
    startCommand: gunicorn voteapp.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /accounts/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voteapp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: voting-app-wvk6.onrender.com,localhost,127.0.0.1

  # PostgreSQL Database
  - type: pserv
    name: voteapp-db
    env: postgres
    plan: free
    user: voteapp_user
    databaseName: voteapp_db
    ipAllowList: []
