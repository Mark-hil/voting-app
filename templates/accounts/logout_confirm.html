{% extends 'base.html' %}
{% block title %}Sign Out — VoteApp{% endblock %}

{% block body %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background: radial-gradient(circle at 50% 30%, rgba(244, 63, 94, 0.05) 0%, transparent 60%), var(--slate-50); padding:20px;">
  <div class="card" style="max-width:420px; width:100%; padding:44px 36px; text-align:center; box-shadow:var(--shadow-xl); border-radius:var(--radius-xl);">
    <div style="width:64px;height:64px;background:var(--rose-50);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--rose-600);box-shadow:0 8px 16px rgba(244, 63, 94, 0.15);">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
    <h2 style="font-size:1.4rem;font-weight:800;color:var(--slate-900);margin-bottom:8px;">Sign Out Confirmation</h2>
    <p style="color:var(--slate-500);font-size:0.9rem;margin-bottom:28px;">You will be securely logged out of your session on this device.</p>
    
    <div style="display:flex;gap:12px;justify-content:center;">
      <a href="{% url 'elections:dashboard' %}" class="btn btn-secondary btn-lg">Stay Signed In</a>
      <form method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-lg">Confirm Sign Out</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
