{% extends 'base.html' %}
{% block title %}Sign Out — VoteApp{% endblock %}
{% block body %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F9FAFB;">
  <div class="card" style="max-width:400px; width:90%; padding:40px; text-align:center;">
    <div style="width:56px;height:56px;background:#FEE2E2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <h2 style="font-size:1.2rem;font-weight:700;color:#111827;margin-bottom:8px;">Sign Out?</h2>
    <p style="color:#6B7280;font-size:.9rem;margin-bottom:28px;">You'll be securely logged out of your VoteApp session.</p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <a href="{% url 'elections:dashboard' %}" class="btn btn-secondary">Cancel</a>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Sign Out</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
